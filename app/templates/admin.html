<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 - {{ site_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Serif+4:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>⚙ 管理面板</h1>
            <div class="topbar-nav">
                <a href="/">查看前台</a>
                <a href="/admin/logout">退出登录</a>
            </div>
        </div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="tabs">
            <button class="tab active" onclick="switchTab('list',this)">规则列表</button>
            <button class="tab" onclick="switchTab('add',this)">添加规则</button>
        </div>

        <!-- Tab: 规则列表 -->
        <div id="tab-list" class="tab-content active">
            <div class="card">
                {% if rules %}
                <table>
                    <thead>
                        <tr>
                            <th>文件名</th>
                            <th>显示名称</th>
                            <th>大小</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for r in rules %}
                        <tr>
                            <td><span class="file-badge">{{ r.filename }}</span></td>
                            <td>{{ r.display_name }}</td>
                            <td class="size">{{ "%.1f"|format(r.size / 1024) }} KB</td>
                            <td class="actions">
                                <form method="post" action="/admin/rules/{{ r.id }}/move" style="display:inline">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <input type="hidden" name="direction" value="up">
                                    <button type="submit" class="btn btn-sm btn-ghost" title="上移">↑</button>
                                </form>
                                <form method="post" action="/admin/rules/{{ r.id }}/move" style="display:inline">
                                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                    <input type="hidden" name="direction" value="down">
                                    <button type="submit" class="btn btn-sm btn-ghost" title="下移">↓</button>
                                </form>
                                <button class="btn btn-sm btn-ghost" onclick='openEdit({{ r.id }}, {{ r.filename | tojson }}, {{ r.display_name | tojson }}, {{ r.description | tojson }})'>编辑</button>
                                <button class="btn btn-sm btn-danger" onclick='deleteRule({{ r.id }}, {{ r.filename | tojson }})'>删除</button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                <div class="empty-state">
                    <div class="icon">📂</div>
                    <p>档案室尚无文献，点击「添加规则」开始归档</p>
                </div>
                {% endif %}
            </div>
        </div>

        <!-- Tab: 添加规则 -->
        <div id="tab-add" class="tab-content">
            <div class="card">
                <h2 style="font-family:'Playfair Display',serif; font-size:1.1em; font-weight:700; margin-bottom:24px;">归档新规则</h2>
                <form method="post" action="/admin/rules" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-row">
                        <div class="form-group" style="flex:1">
                            <label>文件名 *</label>
                            <input type="text" name="filename" placeholder="my_rules.yaml" required>
                            <div class="form-hint">自动添加 .yaml 后缀</div>
                        </div>
                        <div class="form-group" style="flex:1">
                            <label>显示名称 *</label>
                            <input type="text" name="display_name" placeholder="国内域名规则" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>描述（可选）</label>
                        <input type="text" name="description" placeholder="简要说明规则用途">
                    </div>
                    <div class="form-group">
                        <label>规则内容</label>
                        <textarea name="content" placeholder="payload:&#10;  - DOMAIN-SUFFIX,example.com&#10;  - DOMAIN-KEYWORD,google"></textarea>
                        <div class="form-hint">粘贴 YAML 内容，或上传文件</div>
                    </div>
                    <div class="form-group">
                        <label>上传文件（可选）</label>
                        <input type="file" name="file" accept=".yaml,.yml,.txt">
                    </div>
                    <button type="submit" class="btn btn-accent">归 档</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>编辑规则</h2>
            <form method="post" id="editForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-row">
                    <div class="form-group" style="flex:1">
                        <label>显示名称</label>
                        <input type="text" name="display_name" id="editDisplayName">
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>描述</label>
                        <input type="text" name="description" id="editDescription">
                    </div>
                </div>
                <div class="form-group">
                    <label>更新内容（粘贴新 YAML 覆盖）</label>
                    <textarea name="content" id="editContent" placeholder="留空则不修改文件内容"></textarea>
                </div>
                <div class="form-group">
                    <label>或上传新文件</label>
                    <input type="file" name="file" accept=".yaml,.yml,.txt">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeEdit()">取消</button>
                    <button type="submit" class="btn btn-primary">保存更改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    function switchTab(name, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        el.classList.add('active');
    }

    function openEdit(id, filename, displayName, description) {
        document.getElementById('editForm').action = '/admin/rules/' + id;
        document.getElementById('editDisplayName').value = displayName;
        document.getElementById('editDescription').value = description || '';
        document.getElementById('editContent').value = '';
        document.getElementById('editModal').classList.add('show');
    }

    function closeEdit() {
        document.getElementById('editModal').classList.remove('show');
    }

    function deleteRule(id, filename) {
        if (confirm('确定删除 ' + filename + ' ？此操作不可恢复。')) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/rules/' + id + '/delete';
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'csrf_token';
            input.value = '{{ csrf_token() }}';
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }
    }

    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeEdit();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeEdit();
    });
    </script>
</body>
</html>
